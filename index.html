<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SYNAPSE AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0E111A;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 70px 20px;
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 25px;
      border-radius: 26px;
      background: linear-gradient(135deg, #7B2CFF, #2962FF, #00E6FF);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: bold;
      box-shadow: 0 0 55px rgba(41, 98, 255, 0.35);
    }

    h1 {
      font-size: 46px;
      letter-spacing: 4px;
      margin-bottom: 15px;
      background: linear-gradient(90deg, #7B2CFF, #2962FF, #00E6FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slogan {
      color: #A1A7B3;
      font-size: 20px;
      margin-bottom: 45px;
    }

    .agent-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 30px;
      text-align: left;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .agent-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .agent-description {
      color: #A1A7B3;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      background: #151923;
      border: 1px solid #2A3040;
      border-radius: 12px;
      padding: 16px;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #2962FF;
    }

    textarea::placeholder {
      color: #6F7685;
    }

    .button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #7B2CFF, #2962FF);
      box-shadow: 0 10px 35px rgba(41, 98, 255, 0.25);
    }

    .button:active {
      transform: scale(0.99);
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #151923;
      border-radius: 12px;
      border: 1px solid #2A3040;
      color: #A1A7B3;
      line-height: 1.6;
    }

    .footer {
      margin-top: 35px;
      color: #6F7685;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">S</div>

    <h1>SYNAPSE AI</h1>

    <div class="slogan">
      One platform. Infinite AI agents.
    </div>

    <div class="agent-card">

      <div class="agent-title">
        🔎 Research Agent
      </div>

      <div class="agent-description">
        Give the agent a task and let AI research,
        analyze and structure the information for you.
      </div>

      <textarea
        id="task"
        placeholder="Example: Find 10 solar panel manufacturers in Poland and compare their prices."
      ></textarea>

      <button class="button" onclick="runAgent()">
        Run Research Agent
      </button>

      <div class="result" id="result">
        Your research result will appear here.
      </div>

    </div>

    <div class="footer">
      SYNAPSE AI • AI Agent Platform
    </div>

  </div>

  <script>
    function runAgent() {
      const task = document.getElementById("task").value.trim();
      const result = document.getElementById("result");

      if (!task) {
        result.style.display = "block";
        result.innerText = "Please enter a research task.";
        return;
      }

      result.style.display = "block";
      result.innerText =
        "Research Agent received your task. AI connection will be added next.";
    }
  </script>

</body>
</html>
