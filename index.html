<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SYNAPSE AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0E111A;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 900px;
    }

    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 30px;
      border-radius: 30px;
      background: linear-gradient(135deg, #7B2CFF, #2962FF, #00E6FF);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      font-weight: bold;
      box-shadow: 0 0 60px rgba(41, 98, 255, 0.35);
    }

    h1 {
      font-size: 52px;
      letter-spacing: 4px;
      margin-bottom: 18px;
      background: linear-gradient(90deg, #7B2CFF, #2962FF, #00E6FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slogan {
      font-size: 22px;
      color: #A1A7B3;
      margin-bottom: 40px;
    }

    .description {
      font-size: 17px;
      color: #A1A7B3;
      line-height: 1.7;
      max-width: 650px;
      margin: 0 auto 40px;
    }

    .button {
      display: inline-block;
      padding: 16px 32px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-size: 17px;
      font-weight: bold;
      background: linear-gradient(90deg, #7B2CFF, #2962FF);
      box-shadow: 0 10px 35px rgba(41, 98, 255, 0.3);
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .agents {
      margin-top: 55px;
      color: #6f7685;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">S</div>

    <h1>SYNAPSE AI</h1>

    <div class="slogan">
      One platform. Infinite AI agents.
    </div>

    <div class="description">
      Discover a new generation of AI agents designed to research,
      analyze, create and automate tasks.
    </div>

    <a href="#" class="button">
      Try Research Agent
    </a>

    <div class="agents">
      Research • Marketing • Business • Creator • More
    </div>

  </div>

</body>
</html>
